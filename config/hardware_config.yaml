measurements:
  results_root: ./results/

# Tube lengths mm:
# Inside Boxer Pumps = 65 (0,19ml)
# Inside DC Pumps = 150 (0.44ml)
# Bottle to Pump = 395 (1,15ml => 0,0029114 ml/mm)
# Mixer to Cell = 50+150+85 (0.83ml)
# Cell to Waste = 200+95+.. (0.86ml)
# Waste Length = 300 (0.88ml)
# Waste Spacing = 110 (0.32ml)


# Bottle to boxer and trough: 395mm plus 65mm = 460mm. 460mm * 0.0029114 = 1.339244mL
# Pumps to Needles
# 1 = 100 (0.29) Total> 1.63mL
# 2 = 160 (0.47) Total> 1.80mL
# 3 = 160 (0.47) Total> 1.80mL
# 4 = 200 (0.58) Total> 1.92mL
# 5 = 240 (0.7) Total> 2.04 mL
# 6 = 320 Total> 2.27mL
# 7 = 350 Total> 2.36mL
# 8 = 400 Total> 2.50mL

# Map each chemical to its controller/pump index and prime volume to fill the tubing.
# pump_index is 1..4 for each controller, cost is per ml

chemicals:
  Milli-Q: { controller: A, pump_index: 1, prime_ml: 1.8, cost: 0.1 } 
  Standard_1413u: { controller: A, pump_index: 2, prime_ml: 1.9, cost: 0.5 } 
  HCl: { controller: A, pump_index: 3, prime_ml: 1.9, cost: 0.2 }
  NaNO3_5m: { controller: A, pump_index: 4, prime_ml: 2.1, cost: 5 }
  Standard_1288u: { controller: B, pump_index: 1, prime_ml: 2.2, cost: 1 }
  Chem6: { controller: B, pump_index: 2, prime_ml: 1.0, cost: 1 } 
  Chem7: { controller: B, pump_index: 3, prime_ml: 1.0, cost: 1 }
  Chem8: { controller: B, pump_index: 4, prime_ml: 1.0, cost: 1 }

system:
  # Tube volumes between destinations (ml)
  mix_to_cell_ml: 0.4 #0.83
  cell_to_waste_ml: 1.25 #2.5
  waste_no: 1 # 1..4

# Default pump parameters used by the scheduler for priming / dosing.
pumps:
  # Calibration for stepper pumps (currently hardcoded in firmware)
  ml_per_rev: 0.094
  mixing_flowrate: 0.1 # ml/s
  priming_flowrate: 0.2
  # Calibration for DC pumps
  transfer_pwm: 50 # %
  waste_pwm: 60
  mixing_pwm: 15
  ml_per_s: 0.2

temperature:
  tolerance_C: 0.5 # plus or minus
  steady_s: 120 #2min
  timeout_s: 4000
  settle_s: 30
  mode: 6 # 2 = Bang-Bang, 6 = PID

communication:
  pump_controller_A: # Has 2x DC transfer pumps
    ble_name: PumpControllerA
    mock: True
    timeout: 60
    ble: False
    port: COM15
    baud: 115200

  pump_controller_B: # Has 4x DC waste pumps
    ble_name: PumpControllerB
    mock: True
    timeout: 60
    ble: False
    port: COM17
    baud: 115200

  temperature_controller:
    port: COM23
    baud: 115200
    mock: False

  squidstat:
    port: COM20
    channel: 0
    instrument: Plus2695
    mock: True